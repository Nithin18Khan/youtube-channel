name: Refine Malayalam Scripts

# Runs after daily YouTube upload finishes, then commits polished scripts.
# Free Gemini tier: ~18 episodes/run. Paid API: set secret GEMINI_REFINE_MAX_PER_RUN=100

on:
  workflow_run:
    workflows: ["Daily YouTube Pipeline"]
    types: [completed]
  schedule:
    # 18:30 UTC = 12:00 AM IST backup (if upload workflow skipped)
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      max_per_run:
        description: "Max episodes this run (18=free tier, 0=unlimited paid API)"
        required: false
        default: "18"

permissions:
  contents: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_REFINE_MAX_PER_RUN: ${{ secrets.GEMINI_REFINE_MAX_PER_RUN || '18' }}

jobs:
  refine-malayalam:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refine Malayalam scripts (batch)
        env:
          GEMINI_REFINE_MAX_PER_RUN: ${{ github.event.inputs.max_per_run || secrets.GEMINI_REFINE_MAX_PER_RUN || '18' }}
        run: |
          python scripts/refine_malayalam_gemini.py --all --from-day 1 --to-day 30 --delay 3
          python -c "
          import json
          from pathlib import Path
          p = Path('data/gemini_refine_progress.json')
          if p.exists():
              d = json.loads(p.read_text(encoding='utf-8'))
              done = len(d.get('done', []))
              failed = len(d.get('failed', []))
              print(f'Refine progress: {done}/360 done, {failed} failed')
          "

      - name: Commit refined scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gemini_refine_progress.json scripts/season_* scripts/day_*.json 2>/dev/null || true
          git diff --staged --quiet && echo "No script changes to commit." && exit 0
          git commit -m "chore: Gemini Malayalam refine batch [skip ci]"
          git push
